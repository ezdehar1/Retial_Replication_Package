apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics1
  labels:
    app: analytics1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics1
  template:
    metadata:
      labels:
        app: analytics1
    spec:
      containers:
        - name: analytics1
          image: fakhertalahmeh/analytics1-1.7:latest
          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: analytics1
  labels:
    app: analytics1
spec:
  type: LoadBalancer
  selector:
    app: analytics1
  ports:
    - protocol: TCP
      port: 8301
      targetPort: 8000