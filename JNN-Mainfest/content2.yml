apiVersion: apps/v1
kind: Deployment
metadata:
  name: content2
  labels:
    app: content2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content2
  template:
    metadata:
      labels:
        app: content2
    spec:
      containers:
        - name: content2
          image: fakhertalahmeh/content2-1.7:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          # ⭐ Added resource configuration
          resources:
            requests:
              cpu: "250m"
              memory: "300Mi"
            limits:
              cpu: "800m"
              memory: "700Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: content2
  labels:
    app: content2
spec:
  type: LoadBalancer
  selector:
    app: content2
  ports:
    - protocol: TCP
      port: 8202
      targetPort: 8000